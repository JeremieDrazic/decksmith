packages:
  - apps/*
  - packages/*

catalog:
  '@fastify/cors': ^11.3.0
  '@fastify/sensible': ^6.0.4
  '@supabase/supabase-js': ^2.112.2
  '@testing-library/react': ^16.3.2
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  dotenv: ^17.4.2
  fastify: ^5.12.6
  fastify-plugin: ^6.0.0
  fastify-type-provider-zod: ^6.1.0
  jsdom: ^29.1.1
  lucide-react: ^1.30.0
  pino-pretty: ^13.1.3
  react: ^19.2.8
  react-dom: ^19.2.8
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.6.6

# Security pins (CVE fixes) — force patched versions of transitive deps whose
# parents still resolve a vulnerable range. Revisit when the parents catch up.
overrides:
  # Runtime (shipped in Docker images)
  ip-address: '>=10.7.4' # via @fastify/rate-limit — subnet/parse bugs
  mysql2: '>=3.23.1' # unused optional prisma driver (we use pg) — pinned defensively
  deepmerge-ts: '>=8.0.0' # via @prisma/config (build-time CLI) — stack-exhaustion fix
  # Dev/build tooling only (never in prod images)
  picomatch: '>=4.0.4' # ReDoS via extglob
  seroval: '>=1.6.3' # via @tanstack/react-start serialization
  fast-copy: '>=4.1.0' # via pino logger
  follow-redirects: '>=1.16.1'
  uuid: '>=11.1.1'
  tinypool: '>=2.1.2' # via vitest worker pool
  brace-expansion: '>=5.0.10' # via glob/minimatch in test tooling
  dompurify: '>=3.4.17' # via VitePress (apps/docs)
  katex: '>=0.18.2' # via VitePress (apps/docs)

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false # optional native accel for bullmq's msgpackr; JS fallback is fine
  msw: true
  prisma: true
  unrs-resolver: true
