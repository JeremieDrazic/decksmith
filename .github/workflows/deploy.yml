name: Deploy

# Release pipeline (main-only). CI (ci.yml) stays the PR-gating quality workflow;
# this one builds images, pushes them to GHCR, and redeploys the VPS over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run (e.g. after flipping a new GHCR package to public)

# Never cancel a deploy mid-flight — queue runs instead, to avoid a half-applied VPS state.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # required for the built-in GITHUB_TOKEN to push to GHCR

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/jeremiedrazic/decksmith-api:${{ github.sha }}
            ghcr.io/jeremiedrazic/decksmith-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Empty VITE_API_URL → browser bundle uses same-origin relative /api.
          build-args: |
            VITE_API_URL=
          tags: |
            ghcr.io/jeremiedrazic/decksmith-web:${{ github.sha }}
            ghcr.io/jeremiedrazic/decksmith-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-statics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build the static artifacts in the runner (pnpm is here), then package them into nginx.
      - run: pnpm --filter @decksmith/docs build
      - run: pnpm --filter @decksmith/storybook build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push statics image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/statics.Dockerfile
          push: true
          tags: |
            ghcr.io/jeremiedrazic/decksmith-statics:${{ github.sha }}
            ghcr.io/jeremiedrazic/decksmith-statics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-web, build-statics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the VPS copy of compose.yml in sync with the repo on every deploy.
      - name: Sync compose file to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.yml
          target: ~/apps/decksmith/
          strip_components: 1 # drop the deploy/ prefix → lands as ~/apps/decksmith/compose.yml

      # Pin the deployed commit SHA in the server .env, then pull + restart.
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/apps/decksmith
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            docker compose pull
            docker compose up -d
        env:
          IMAGE_TAG: ${{ github.sha }}
