name: Deploy

# Release pipeline. Runs after the CI workflow SUCCEEDS on main (workflow_run +
# a success gate) — a commit that fails CI can never deploy. workflow_dispatch
# stays for manual re-runs (e.g. after flipping a GHCR package to public).
#
# Order: release → build-{api,web,statics} → deploy.
# The `release` job runs semantic-release first: it computes the SemVer version
# from the conventional commits, creates the git tag + GitHub Release, and exposes
# the version. semantic-release pushes NO commit to main (tag + release only), and
# CI triggers on branches not tags, so this never loops back into CI. The build jobs
# tag the images with that version (alongside the SHA) and bake it into the app so
# /api/version and the web footer show it.
#
# On a workflow_run trigger, github.sha is main's HEAD at trigger time (which may
# have moved on); the commit that actually passed CI is workflow_run.head_sha.
# DEPLOY_SHA resolves to that exact commit (falling back to github.sha on manual
# dispatch), and the build/deploy jobs check it out, so we never deploy an untested SHA.
#
# Third-party actions are pinned to immutable commit SHAs (tag in the comment):
# the appleboy actions receive the VPS SSH key and the docker actions push to GHCR,
# so a mutable tag repointed at malicious code would be a supply-chain hole.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight — queue runs instead, to avoid a half-applied VPS state.
concurrency:
  group: deploy
  cancel-in-progress: false

# Permissions are declared per job (least privilege), not workflow-wide.

env:
  # The commit being deployed (see header comment).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release:
    # Run on manual dispatch, or only when the triggering CI run succeeded.
    if:
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub Release
      issues: write # semantic-release comments on released issues…
      pull-requests: write # …and PRs
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Release from the branch (main), with full history + tags for semantic-release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Effective version to stamp: the new release if one was published, otherwise the
      # latest existing tag (e.g. a docs-only push), or 0.0.0 before the first release.
      - id: resolve
        run: |
          if [ "${{ steps.semrel.outputs.new_release_published }}" = "true" ]; then
            version="${{ steps.semrel.outputs.new_release_version }}"
          else
            version="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            version="${version#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Stamping version: $version"

  build-api:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/jeremiedrazic/decksmith-api:${{ env.DEPLOY_SHA }}
            ghcr.io/jeremiedrazic/decksmith-api:${{ needs.release.outputs.version }}
            ghcr.io/jeremiedrazic/decksmith-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Empty VITE_API_URL → browser bundle uses same-origin relative /api.
          # VITE_SENTRY_DSN from a secret (contains the real monitoring domain — not in the repo).
          build-args: |
            VITE_API_URL=
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_APP_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/jeremiedrazic/decksmith-web:${{ env.DEPLOY_SHA }}
            ghcr.io/jeremiedrazic/decksmith-web:${{ needs.release.outputs.version }}
            ghcr.io/jeremiedrazic/decksmith-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-statics:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build the static artifacts in the runner (pnpm is here), then package them into nginx.
      - run: pnpm --filter @decksmith/docs build
      - run: pnpm --filter @decksmith/storybook build

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push statics image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/statics.Dockerfile
          push: true
          tags: |
            ghcr.io/jeremiedrazic/decksmith-statics:${{ env.DEPLOY_SHA }}
            ghcr.io/jeremiedrazic/decksmith-statics:${{ needs.release.outputs.version }}
            ghcr.io/jeremiedrazic/decksmith-statics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-web, build-statics]
    runs-on: ubuntu-latest
    # Least privilege: this job holds the VPS SSH key — no package/write access,
    # so a compromised step here cannot also tamper with GHCR images.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Keep the VPS copy of compose.yml in sync with the repo on every deploy.
      - name: Sync compose file to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.yml
          target: ~/apps/decksmith/
          strip_components: 1 # drop the deploy/ prefix → lands as ~/apps/decksmith/compose.yml

      # Pin the deployed commit SHA in the server .env, then pull + restart.
      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/apps/decksmith
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            docker compose pull
            docker compose up -d
        env:
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
