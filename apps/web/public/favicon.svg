<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    /* Dark mode default — amber accent */
    svg { color: #e8b84b; }
    /* Light mode override — violet accent */
    @media (prefers-color-scheme: light) { svg { color: #5b4fcf; } }
  </style>
  <!-- Outer diamond fill (very subtle) -->
  <path d="M16 1.5 30.5 16 16 30.5 1.5 16Z" fill="currentColor" opacity="0.08"/>
