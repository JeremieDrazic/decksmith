  <path d="M16 1.5 30.5 16 16 30.5 1.5 16Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Facets — lit from top-left -->
  <path d="M1.5 16 16 1.5 16 8.5Z" fill="currentColor" opacity="0.75"/>
  <path d="M1.5 16 16 8.5 8.5 16Z" fill="currentColor" opacity="0.48"/>
