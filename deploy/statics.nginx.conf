# nginx config for the combined static image, served behind Traefik (TLS terminated upstream).
#
# absolute_redirect off makes nginx emit RELATIVE redirects (e.g. Location: /docs/) when it
# appends a trailing slash to a directory request. Without it, nginx builds an absolute URL from
# its own listen port and http scheme — behind the proxy that becomes a wrong http:// (and drops
# the real port), because nginx can't see that the external connection was HTTPS.
server {
    listen 80;
    absolute_redirect off;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
