# Decksmith deployment stack — runs on the VPS at ~/apps/decksmith/compose.yml
#
# The VPS never builds: images are built + pushed to GHCR by CI (.github/workflows/deploy.yml),
# then pulled here. IMAGE_TAG (the deployed commit SHA) and DECKSMITH_HOST live in the sibling
# .env file, which is NEVER committed (secrets + real domain).
#
# Traefik (shared, in ~/infra/) owns ports 80/443 and routes to these containers by reading their
# labels off the shared `proxy` network. See ADR-0026 + apps/docs/deployment/reverse-proxy.md.

# Fixed project name → deterministic network/resource names regardless of the directory it runs from.
name: decksmith

# Cap container logs so they can't fill the shared VPS disk: 3 files × 10 MB max per container.
# `&default-logging` defines a reusable block; each service references it with `*default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    image: ghcr.io/jeremiedrazic/decksmith-api:${IMAGE_TAG:-latest}
    container_name: decksmith-api
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-api.rule=Host(`${DECKSMITH_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.decksmith-api.entrypoints=websecure
      - traefik.http.routers.decksmith-api.tls.certresolver=le
      - traefik.http.services.decksmith-api.loadbalancer.server.port=3000
      - traefik.http.routers.decksmith-api.middlewares=decksmith-security

  # Web SSR server (TanStack Start / node). Reaches the API in-cluster over `internal`;
  # the browser hits /api same-origin (relative), so cookies stay same-origin.
  web:
    image: ghcr.io/jeremiedrazic/decksmith-web:${IMAGE_TAG:-latest}
    container_name: decksmith-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      - API_URL=http://api:3000
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-web.rule=Host(`${DECKSMITH_HOST}`)
      - traefik.http.routers.decksmith-web.entrypoints=websecure
      - traefik.http.routers.decksmith-web.tls.certresolver=le
      - traefik.http.services.decksmith-web.loadbalancer.server.port=3000
      - traefik.http.routers.decksmith-web.middlewares=decksmith-security
      # Shared security-headers middleware — defined here, referenced by all Decksmith routers.
      - traefik.http.middlewares.decksmith-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.decksmith-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.decksmith-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.decksmith-security.headers.referrerPolicy=strict-origin-when-cross-origin

  # Static sites (VitePress docs + Storybook) served by unprivileged nginx on port 8080.
  statics:
    image: ghcr.io/jeremiedrazic/decksmith-statics:${IMAGE_TAG:-latest}
    container_name: decksmith-statics
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-statics.rule=Host(`${DECKSMITH_HOST}`) &&
        (PathPrefix(`/docs`) || PathPrefix(`/design-system`))
      - traefik.http.routers.decksmith-statics.entrypoints=websecure
      - traefik.http.routers.decksmith-statics.tls.certresolver=le
      - traefik.http.services.decksmith-statics.loadbalancer.server.port=8080
      - traefik.http.routers.decksmith-statics.middlewares=decksmith-security

  # Redis — BullMQ's backing store: holds the job queue and the repeatable-job schedule.
  # `internal` ONLY: never routed by Traefik, never reachable from the internet.
  # --requirepass locks it (any container on `internal` could otherwise read/write the queue);
  # --appendonly yes (+ the redis-data volume) persists the daily-sync schedule across a Redis
  # restart — without it, a Redis-only restart would silently drop the cron until the worker reboots.
  redis:
    # Pinned by digest (7.4-alpine at time of writing) for reproducible prod pulls, matching the
    # exact-pin convention of the node base images. Bump deliberately when adopting a new patch.
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: decksmith-redis
    restart: unless-stopped
    logging: *default-logging
    # `:?` fails `docker compose up` loudly if REDIS_PASSWORD is unset/empty, rather than
    # silently starting a passwordless Redis. Set it in the server .env (never committed).
    command:
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in
      ~/apps/decksmith/.env} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks: [internal]
    volumes:
      - redis-data:/data
    # `$$` escapes to a single `$` in the container, so redis-cli reads REDIS_PASSWORD from the
    # container env at runtime rather than baking the secret into the healthcheck definition.
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  # Background worker — the BullMQ consumer running the daily Scryfall card-sync (ADR-0030/0031).
  # Headless: no HTTP server, no Traefik labels, `internal` only. Still has egress to Supabase +
  # Scryfall (internal is a normal bridge). Waits for Redis to be healthy before starting.
  worker:
    image: ghcr.io/jeremiedrazic/decksmith-worker:${IMAGE_TAG:-latest}
    container_name: decksmith-worker
    restart: unless-stopped
    logging: *default-logging
    env_file: .env # DATABASE_URL + SUPABASE_* (shared with the API)
    environment:
      # Redis URL format is redis://:PASSWORD@HOST:PORT; `redis` is the service name (Docker DNS).
      # Same fail-closed guard as the redis service: never connect with an empty password segment.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in
        ~/apps/decksmith/.env}@redis:6379
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy

networks:
  # Shared with the Traefik stack — how the proxy discovers and reaches this container.
  proxy:
    external: true
  # Project-private network for service-to-service calls (web → api, worker → redis),
  # isolated from the shared proxy network's DNS namespace.
  internal: {}

volumes:
  # Persists Redis's AOF file so the daily-sync schedule survives container recreation.
  redis-data: {}
