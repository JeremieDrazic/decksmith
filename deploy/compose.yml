# Decksmith deployment stack — runs on the VPS at ~/apps/decksmith/compose.yml
#
# The VPS never builds: images are built + pushed to GHCR by CI (.github/workflows/deploy.yml),
# then pulled here. IMAGE_TAG (the deployed commit SHA) and DECKSMITH_HOST live in the sibling
# .env file, which is NEVER committed (secrets + real domain).
#
# Traefik (shared, in ~/infra/) owns ports 80/443 and routes to these containers by reading their
# labels off the shared `proxy` network. See ADR-0026 + apps/docs/deployment/reverse-proxy.md.

# Fixed project name → deterministic network/resource names regardless of the directory it runs from.
name: decksmith

# Cap container logs so they can't fill the shared VPS disk: 3 files × 10 MB max per container.
# `&default-logging` defines a reusable block; each service references it with `*default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    image: ghcr.io/jeremiedrazic/decksmith-api:${IMAGE_TAG:-latest}
    container_name: decksmith-api
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-api.rule=Host(`${DECKSMITH_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.decksmith-api.entrypoints=websecure
      - traefik.http.routers.decksmith-api.tls.certresolver=le
      - traefik.http.services.decksmith-api.loadbalancer.server.port=3000

  # Web SSR server (TanStack Start / node). Reaches the API in-cluster over `internal`;
  # the browser hits /api same-origin (relative), so cookies stay same-origin.
  web:
    image: ghcr.io/jeremiedrazic/decksmith-web:${IMAGE_TAG:-latest}
    container_name: decksmith-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      - API_URL=http://api:3000
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-web.rule=Host(`${DECKSMITH_HOST}`)
      - traefik.http.routers.decksmith-web.entrypoints=websecure
      - traefik.http.routers.decksmith-web.tls.certresolver=le
      - traefik.http.services.decksmith-web.loadbalancer.server.port=3000

  # Static sites (VitePress docs + Storybook) served by nginx on port 80.
  statics:
    image: ghcr.io/jeremiedrazic/decksmith-statics:${IMAGE_TAG:-latest}
    container_name: decksmith-statics
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.decksmith-statics.rule=Host(`${DECKSMITH_HOST}`) &&
        (PathPrefix(`/docs`) || PathPrefix(`/design-system`))
      - traefik.http.routers.decksmith-statics.entrypoints=websecure
      - traefik.http.routers.decksmith-statics.tls.certresolver=le
      - traefik.http.services.decksmith-statics.loadbalancer.server.port=80

networks:
  # Shared with the Traefik stack — how the proxy discovers and reaches this container.
  proxy:
    external: true
  # Project-private network for service-to-service calls (web → api),
  # isolated from the shared proxy network's DNS namespace.
  internal: {}
